<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="45%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>
  <!-- Squircle en blau corporatiu de la web (#1d4ed8 a #0b1120) -->
  <rect width="100" height="100" rx="28" fill="url(#bgGrad)" />
  
  <!-- Signe esquerre de codi i ala pedagògica < en blau gel lluminós (#eff6ff a #60a5fa) -->
  <path d="M 38 32 L 23 50 L 38 68" fill="none" stroke="url(#wingGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Signe dret de codi i ala pedagògica > en blau gel lluminós (#eff6ff a #60a5fa) -->
  <path d="M 62 32 L 77 50 L 62 68" fill="none" stroke="url(#wingGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Nucli central lluminós en suspensió -->
  <circle cx="50" cy="50" r="6" fill="#ffffff" />
</svg>
