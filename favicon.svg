<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Squircle en blau corporatiu sòlid de la web (#1d4ed8, sense gradient) -->
  <rect width="100" height="100" rx="28" fill="#1d4ed8" />
  
  <!-- Signe esquerre de codi i ala pedagògica < en blanc pur -->
  <path d="M 38 32 L 23 50 L 38 68" fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Signe dret de codi i ala pedagògica > en blanc pur -->
  <path d="M 62 32 L 77 50 L 62 68" fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Nucli central lluminós en suspensió -->
  <circle cx="50" cy="50" r="6" fill="#ffffff" />
</svg>
