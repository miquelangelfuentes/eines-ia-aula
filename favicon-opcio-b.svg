<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="barGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
  </defs>
  <!-- Squircle blau reial vibrant -->
  <rect width="100" height="100" rx="28" fill="url(#bgGradB)" />
  
  <!-- Chevron A (elevació / creixement / antigravetat) -->
  <path d="M 24 72 L 50 25 L 76 72" fill="none" stroke="#ffffff" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Barra transversal en suspensió levitant -->
  <line x1="35" y1="55" x2="65" y2="55" stroke="url(#barGradB)" stroke-width="7.5" stroke-linecap="round" />
</svg>
