<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <!-- Fons squircle fosc IDE -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad2)" stroke="#334155" stroke-width="2" />
  
  <!-- Òrbita el·líptica en suspensió ("antigravetat") -->
  <ellipse cx="50" cy="50" rx="40" ry="16" fill="none" stroke="url(#orbitGrad)" stroke-width="4.5" stroke-dasharray="14 4" transform="rotate(-22 50 50)" />
  
  <!-- Planeta / esfera flotant a l'òrbita -->
  <circle cx="82" cy="38" r="5" fill="#38bdf8" />
  
  <!-- Codi web interactiu < / > central -->
  <!-- < -->
  <path d="M 36 38 L 24 50 L 36 62" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- / -->
  <path d="M 54 36 L 46 64" fill="none" stroke="#2dd4bf" stroke-width="4.5" stroke-linecap="round" />
  <!-- > -->
  <path d="M 64 38 L 76 50 L 64 62" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
