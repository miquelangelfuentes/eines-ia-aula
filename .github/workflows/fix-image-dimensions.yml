name: Fix image dimensions

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-image-dimensions.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Correct intrinsic dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          root = Path('.')
          for html in root.glob('*.html'):
              text = html.read_text(encoding='utf-8')
              def repl(match):
                  before, src, after = match.group(1), match.group(2), match.group(3)
                  p = root / src.split('?', 1)[0].split('#', 1)[0]
                  if not p.exists():
                      return match.group(0)
                  w = h = None
                  if p.suffix.lower() == '.svg':
                      svg = p.read_text(encoding='utf-8', errors='ignore')[:3000]
                      mw = re.search(r'\bwidth=["\']([0-9.]+)', svg)
                      mh = re.search(r'\bheight=["\']([0-9.]+)', svg)
                      if mw and mh:
                          w, h = str(round(float(mw.group(1)))), str(round(float(mh.group(1))))
                  else:
                      info = subprocess.check_output(['file', '-b', str(p)], text=True)
                      pairs = re.findall(r'(?<![0-9.])(\d+)\s*x\s*(\d+)(?![0-9.])', info, re.I)
                      if pairs:
                          w, h = pairs[-1]
                  if not w or not h:
                      return match.group(0)
                  attrs = re.sub(r'\s+width=["\'][^"\']*["\']', '', after)
                  attrs = re.sub(r'\s+height=["\'][^"\']*["\']', '', attrs)
                  return f'{before}{src}" width="{w}" height="{h}{attrs}'

              pattern = re.compile(r'(<img\b[^>]*?\bsrc=["\'])([^"\']+)(["\'][^>]*>)', re.I)
              text = pattern.sub(repl, text)
              html.write_text(text, encoding='utf-8')
          PY
      - name: Validate result
        run: python scripts/validate_site.py
      - name: Commit corrected dimensions
        run: |
          git checkout HEAD -- .github/workflows/fix-image-dimensions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Corregeix dimensions intrínseques de les imatges"
          git push
