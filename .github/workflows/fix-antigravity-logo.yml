name: Fix Antigravity logo

on:
  push:
    paths:
      - '.github/workflows/fix-antigravity-logo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official Antigravity logo and unify references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/logos
          curl -fL --retry 3 'https://antigravity.google/assets/image/brand/antigravity-icon__full-color.png' -o assets/images/logos/antigravity.png
          test -s assets/images/logos/antigravity.png
          file assets/images/logos/antigravity.png
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('bloc1-marc.html'): [
                  ('https://antigravity.google/assets/image/brand/antigravity-icon__full-color.png', 'assets/images/logos/antigravity.png'),
              ],
              Path('bloc2-antigravity.html'): [
                  ('assets/images/logos/antigravity.svg', 'assets/images/logos/antigravity.png'),
              ],
          }

          for path, reps in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in reps:
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'No replacement made in {path}')
              path.write_text(text, encoding='utf-8')

          notices = Path('THIRD_PARTY_NOTICES.md')
          if notices.exists():
              text = notices.read_text(encoding='utf-8')
              text = text.replace('Antigravity and Codex', 'Codex')
              text = text.replace('Antigravity i Codex', 'Codex')
              if 'Google Antigravity brand asset' not in text:
                  text += '\n\n## Google Antigravity brand asset\n\nThe Antigravity icon is an unmodified Google brand asset used only to identify Google Antigravity in comparative and instructional material. Source: https://antigravity.google/assets/image/brand/antigravity-icon__full-color.png. Google and Antigravity are trademarks of Google LLC.\n'
              notices.write_text(text, encoding='utf-8')
          PY
          rm -f assets/images/logos/antigravity.svg

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bloc1-marc.html bloc2-antigravity.html assets/images/logos/antigravity.png assets/images/logos/antigravity.svg THIRD_PARTY_NOTICES.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: use official Antigravity logo locally'
          git push
