name: Apply temporary token flow

on:
  push:
    paths:
      - 'scripts/.temporary-token-flow-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply content changes
        run: python scripts/restore_temporary_token_flow.py
      - name: Build printable dossier
        run: python scripts/build_print.py
      - name: Validate site
        run: python scripts/validate_site.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloc3-github.html README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Simplifica l'autenticació amb token temporal al taller"
            git push
          fi
