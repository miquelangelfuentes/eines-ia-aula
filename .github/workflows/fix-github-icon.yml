name: Fix GitHub quick access icon

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-github-icon.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace unsupported icon
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('bloc3-github.html')
          text = path.read_text(encoding='utf-8')
          old = '<i data-lucide="github" aria-hidden="true" style="width:24px;height:24px;flex:0 0 auto;"></i>'
          new = '<i data-lucide="folder-git-2" aria-hidden="true" style="width:24px;height:24px;flex:0 0 auto;"></i>'
          if old not in text:
              raise SystemExit('No s’ha trobat la icona github esperada')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Build printable dossier
        run: python scripts/build_print.py
      - name: Validate site
        run: python scripts/validate_site.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloc3-github.html
          git commit -m "Corregeix la icona de l'accés ràpid a GitHub"
          git push
