# Flux temporal per localitzar dependències essencials del lloc
name: Localitza recursos externs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descarrega fotografies i Lucide
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/unsplash assets/vendor/lucide

          curl -L --fail --retry 3 'https://images.unsplash.com/photo-1588196749597-9ff075ee6b5b?fm=jpg&fit=crop&w=1200&h=630&q=82' -o assets/images/unsplash/inici-taller.jpg
          curl -L --fail --retry 3 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?fm=jpg&fit=crop&w=1200&h=630&q=82' -o assets/images/unsplash/bloc1-marc.jpg
          curl -L --fail --retry 3 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?fm=jpg&fit=crop&w=1200&h=630&q=82' -o assets/images/unsplash/bloc2-antigravity.jpg
          curl -L --fail --retry 3 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?fm=jpg&fit=crop&w=1200&h=630&q=82' -o assets/images/unsplash/bloc3-github.jpg
          curl -L --fail --retry 3 'https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?fm=jpg&fit=crop&w=1200&h=630&q=82' -o assets/images/unsplash/bloc4-pages-sites.jpg
          curl -L --fail --retry 3 'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?fm=jpg&fit=crop&w=1200&h=630&q=82' -o assets/images/unsplash/bloc5-llicencies.jpg
          curl -L --fail --retry 3 'https://images.unsplash.com/photo-1581291518857-4e27b48ff24e?fm=jpg&fit=crop&w=1200&h=630&q=82' -o assets/images/unsplash/bloc6-recursos-visuals.jpg
          curl -L --fail --retry 3 'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?fm=jpg&fit=crop&w=1200&h=630&q=82' -o assets/images/unsplash/bloc7-bones-practiques.jpg
          curl -L --fail --retry 3 'https://images.unsplash.com/photo-1484480974693-6ca0a78fb36b?fm=jpg&fit=crop&w=1200&h=630&q=82' -o assets/images/unsplash/bloc8-verificacio.jpg
          curl -L --fail --retry 3 'https://images.unsplash.com/photo-1518770660439-4636190af475?fm=jpg&fit=crop&w=1200&h=630&q=82' -o assets/images/unsplash/bloc9-ia-local.jpg

          curl -L --fail --retry 3 'https://unpkg.com/lucide@latest/dist/umd/lucide.min.js' -o assets/vendor/lucide/lucide.min.js
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/lucide-icons/lucide/main/LICENSE' -o assets/vendor/lucide/LICENSE

      - name: Substitueix dependències i matisa la recomanació
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          base = 'https://miquelangelfuentes.github.io/eines-ia-aula/'
          photos = {
              '1588196749597-9ff075ee6b5b': 'inici-taller.jpg',
              '1498050108023-c5249f4df085': 'bloc1-marc.jpg',
              '1517694712202-14dd9538aa97': 'bloc2-antigravity.jpg',
              '1555066931-4365d14bab8c': 'bloc3-github.jpg',
              '1507238691740-187a5b1d37b8': 'bloc4-pages-sites.jpg',
              '1497633762265-9d179a990aa6': 'bloc5-llicencies.jpg',
              '1581291518857-4e27b48ff24e': 'bloc6-recursos-visuals.jpg',
              '1522202176988-66273c2fd55f': 'bloc7-bones-practiques.jpg',
              '1484480974693-6ca0a78fb36b': 'bloc8-verificacio.jpg',
              '1518770660439-4636190af475': 'bloc9-ia-local.jpg',
          }

          for path in root.glob('*.html'):
              text = path.read_text(encoding='utf-8-sig')
              original = text
              for photo_id, filename in photos.items():
                  remote = rf'https://images\.unsplash\.com/photo-{re.escape(photo_id)}\?[^\"<> ]+'
                  local_abs = base + 'assets/images/unsplash/' + filename
                  local_rel = 'assets/images/unsplash/' + filename
                  text = re.sub(rf'(?<=content=\")' + remote, local_abs, text)
                  text = re.sub(rf'(?<=src=\")' + remote, local_rel, text)

              text = text.replace(
                  '<script src="https://unpkg.com/lucide@latest"></script>',
                  '<script src="assets/vendor/lucide/lucide.min.js"></script>'
              )

              text = text.replace(
                  '<h3><i data-lucide="cloud-off" class="lucide" style="width:18px;height:18px;margin-right:6px;color:var(--accent-secondary);"></i> No dependre de serveis que puguin desaparèixer</h3>',
                  '<h3><i data-lucide="cloud-off" class="lucide" style="width:18px;height:18px;margin-right:6px;color:var(--accent-secondary);"></i> Decidir quins recursos convé desar en local</h3>'
              )
              text = text.replace(
                  "Si la vostra pàgina web carrega imatges d'enllaços d'altres servidors aliens, l'activitat es trencarà quan aquests llocs canviïn d'adreça o tanquin. Deseu les imatges a la mateixa carpeta del vostre projecte.",
                  "Deseu dins del projecte els recursos essencials perquè l'activitat funcioni quan la llicència en permeti la redistribució. Una dependència externa pot ser assumible quan respon a una decisió conscient i la seva absència no impedeix completar l'activitat, com passa amb un enllaç de consulta o documentació oficial. Si manteniu un recurs extern, comproveu què passa quan no està disponible."
              )
              text = text.replace(
                  "A l'aula: recursos autònoms que durin durant anys.",
                  "A l'aula: manteniu en local allò que és essencial i deixeu extern allò que no compromet el funcionament del recurs."
              )
              text = text.replace(
                  '<span class="check-text"><strong>4. Recursos propis:</strong> les imatges o icones estan desades dins del projecte i no depenen d\'enllaços d\'altres webs que puguin fallar.</span>',
                  '<span class="check-text"><strong>4. Recursos i dependències:</strong> els recursos essencials que es poden redistribuir són dins del projecte. Les dependències externes restants són intencionades i el recurs continua sent usable si fallen.</span>'
              )

              unsplash_desc = "Plataforma amb milers de fotografies reals d'alta qualitat compartides per fotògrafs d'arreu del món. Té una <a href=\"https://unsplash.com/license\" target=\"_blank\" rel=\"noopener\">llicència pròpia</a> que permet fer servir les fotos de la seva secció gratuïta sense quotes, i agraeix que se citi el nom de l'autor o autora."
              unsplash_new = unsplash_desc + " Quan una fotografia forma part del material i la llicència en permet la redistribució, convé desar-ne una còpia dins del projecte. Aquest mateix lloc web allotja localment les fotografies d'Unsplash i en manté els crèdits visibles."
              text = text.replace(unsplash_desc, unsplash_new)

              if text != original:
                  path.write_text(text, encoding='utf-8')

      - name: Comprova que no queden dependències essencials a Unsplash o unpkg
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'src="https://images\.unsplash\.com|content="https://images\.unsplash\.com|src="https://unpkg\.com/lucide' -- *.html; then
            echo "Encara queden dependències externes que s'havien de localitzar." >&2
            exit 1
          fi

      - name: Desa els canvis al repositori
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets *.html
          if git diff --cached --quiet; then
            echo 'No hi ha canvis per desar.'
            exit 0
          fi
          git commit -m 'Localitza recursos visuals i dependències essencials'
          git push
