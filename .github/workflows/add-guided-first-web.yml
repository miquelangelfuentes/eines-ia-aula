# Final style pass
name: Add guided first web practice

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/add-guided-first-web.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply changes
        run: python scripts/add_guided_first_web.py
      - name: Build printable dossier
        run: python scripts/build_print.py
      - name: Validate site
        run: python scripts/validate_site.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloc2-antigravity.html bloc3-github.html
          git commit -m "Revisa l'estil de la pràctica inicial"
          git push
