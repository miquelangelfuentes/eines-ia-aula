name: Replace decorative magic icons

on:
  push:
    paths:
      - '.github/workflows/replace-magic-icons.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace magic metaphors with functional icons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Substitucions contextuals: mantenim el significat de cada element.
          targeted = {
              Path('index.html'): [
                  ('<div class="home-card-icon"><i data-lucide="sparkles"></i></div>',
                   '<div class="home-card-icon"><i data-lucide="bot"></i></div>'),
              ],
              Path('bloc1-marc.html'): [
                  ('data-lucide="wand-sparkles"', 'data-lucide="layout-template"'),
                  ('data-lucide="sparkles"', 'data-lucide="workflow"'),
              ],
          }

          for path, replacements in targeted.items():
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          # app.js podia assignar sparkles automàticament a títols sense coincidència semàntica.
          app = Path('app.js')
          text = app.read_text(encoding='utf-8').replace("'sparkles'", "'file-text'")
          app.write_text(text, encoding='utf-8')

          # Xarxa de seguretat per a qualsevol altra icona de màgia explícita al web.
          for path in list(Path('.').glob('*.html')) + list(Path('.').glob('*.js')):
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'data-lucide="wand(?:-sparkles)?"', 'data-lucide="pencil-ruler"', text)
              text = re.sub(r'data-lucide="magic-wand"', 'data-lucide="pencil-ruler"', text)
              text = re.sub(r'data-lucide="sparkles"', 'data-lucide="file-text"', text)
              text = text.replace('✨', '✓').replace('🪄', '🛠️')
              path.write_text(text, encoding='utf-8')

          # Verificació final dels fitxers que formen el web.
          forbidden = re.compile(r'data-lucide="[^"]*(?:spark|wand|magic)[^"]*"|[\"\'](?:sparkles|wand-sparkles|magic-wand)[\"\']|✨|🪄', re.I)
          leftovers = []
          for path in list(Path('.').glob('*.html')) + list(Path('.').glob('*.js')):
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if forbidden.search(line):
                      leftovers.append(f'{path}:{number}: {line.strip()}')
          if leftovers:
              raise SystemExit('Encara queden referències de màgia:\n' + '\n'.join(leftovers))
          PY

      - name: Remove temporary audit workflows
        run: |
          rm -f .github/workflows/replace-magic-icons.yml
          rm -f .github/workflows/audit-magic-icons.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: replace magic-themed icons with functional icons"
          git push
