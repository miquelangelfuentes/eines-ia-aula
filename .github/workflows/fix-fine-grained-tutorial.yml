name: Fix fine-grained tutorial

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-fine-grained-tutorial.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace obsolete classic-token tutorial
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('bloc3-github.html')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r'<h3 style="font-size: 0\.975rem;">Com generar un Personal Access Token a GitHub</h3>\s*'
              r'<p style="font-size: 0\.865rem;">\s*'
              r'Videotutorial pas a pas que mostra com entrar a Developer Settings per generar un Token \(classic\) i desar la credencial d.accés\.\s*'
              r'</p>',
              re.DOTALL,
          )
          replacement = '''<h3 style="font-size: 0.975rem;">Com crear un fine-grained personal access token</h3>
            <p style="font-size: 0.865rem;">
              Guia oficial de GitHub per crear un <em>fine-grained personal access token</em>, limitar-lo al repositori necessari i assignar-hi només els permisos que requereix la tasca.
            </p>'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'S’esperava una referència antiga al tutorial i se n’han trobat {count}')
          old_url = 'https://www.youtube.com/watch?v=J-CSiw5CFWE'
          new_url = 'https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens#creating-a-fine-grained-personal-access-token'
          if old_url not in text:
              raise SystemExit('No s’ha trobat l’enllaç antic del videotutorial')
          text = text.replace(old_url, new_url, 1)
          text = text.replace('Veure videotutorial de tokens a YouTube', 'Obrir la guia oficial de GitHub', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloc3-github.html
          git commit -m "Substitueix el tutorial de token classic per fine-grained"
          git push
