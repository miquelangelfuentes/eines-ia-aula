name: Fix credits index icon

on:
  push:
    paths:
      - '.github/workflows/fix-credits-index-icon.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace award icon with C pill
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<div class="home-card-num" style="background: var(--accent-light); color: var(--accent-primary);"><i data-lucide="award" style="width: 18px; height: 18px;"></i></div>'
          new = '<div class="home-card-num">C</div>'
          if old not in text:
              raise SystemExit('Credits award icon snippet not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'style: replace credits medal with C badge'
          git push
