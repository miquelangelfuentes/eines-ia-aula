name: Add token guide

on:
  push:
    paths:
      - 'scripts/.add-token-guide-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add token support resource
        run: python scripts/add_token_guide.py
      - name: Build printable dossier
        run: python scripts/build_print.py
      - name: Validate site
        run: python scripts/validate_site.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloc3-github.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Afegeix la guia de suport per crear el token"
            git push
          fi
