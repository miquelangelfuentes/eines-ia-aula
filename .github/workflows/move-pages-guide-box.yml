name: Move GitHub Pages guide box

on:
  push:
    paths:
      - '.github/workflows/move-pages-guide-box.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Move guide box after step 3
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('bloc3-github.html')
          text = path.read_text(encoding='utf-8')
          href = 'https://docs.github.com/es/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site'
          href_pos = text.index(href)
          start_marker = '      <div style="margin-top: 1rem; margin-bottom: 2rem;'
          start = text.rfind(start_marker, 0, href_pos)
          if start < 0:
              raise SystemExit('Guide box start not found')
          end_marker = '\n      </div>'
          end = text.index(end_marker, href_pos) + len(end_marker)
          box = text[start:end]
          text = text[:start] + text[end:]
          anchor = 'Resultat: en un o dos minuts, GitHub us mostrarà l\'adreça web pública del vostre recurs:'
          anchor_pos = text.index(anchor)
          closing = '\n          </div>\n        </div>\n      </div>'
          insert_at = text.index(closing, anchor_pos) + len(closing)
          text = text[:insert_at] + '\n\n' + box + text[insert_at:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bloc3-github.html
          git commit -m 'style: move GitHub Pages guide after step 3'
          git push
