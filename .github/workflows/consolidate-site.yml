name: Consolidate site

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/consolidate-site.yml"

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare migration dependency
        run: npm install --no-save --package-lock=false jsdom@27.0.1
      - name: Consolidate static content and harden site
        run: node scripts/consolidate-site.mjs
      - name: Complete intrinsic SVG dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          for file in Path('.').glob('*.html'):
              text = file.read_text(encoding='utf-8')
              text = text.replace('src="cc-by-sa.svg"', 'src="cc-by-sa.svg" width="120" height="42"')
              file.write_text(text, encoding='utf-8')
          PY
      - name: Validate result before commit
        run: python scripts/validate_site.py
      - name: Commit consolidated site
        run: |
          git checkout HEAD -- .github/workflows/pages.yml .github/workflows/consolidate-site.yml
          rm -f scripts/consolidate-site.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolida contingut i reforça accessibilitat i validació"
          git push
