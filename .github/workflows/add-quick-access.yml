name: Add quick access boxes

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/add-quick-access.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add quick access boxes
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = {
              'bloc2-antigravity.html': (
                  '    <aside class="pedagogical-highlight" aria-label="Accés ràpid a Google Antigravity" style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:0 0 1rem;">\n'
                  '      <div style="display:flex;align-items:center;gap:.7rem;flex:1 1 18rem;">\n'
                  '        <i data-lucide="rocket" aria-hidden="true" style="width:24px;height:24px;flex:0 0 auto;"></i>\n'
                  '        <div><strong>Accés ràpid</strong><br><span style="font-size:.875rem;">Obriu Google Antigravity per seguir la pràctica del bloc.</span></div>\n'
                  '      </div>\n'
                  '      <a class="btn-primary-action" href="https://antigravity.google/" target="_blank" rel="noopener" style="text-decoration:none;">\n'
                  '        <span>Ves a Google Antigravity</span><i data-lucide="external-link" aria-hidden="true"></i>\n'
                  '      </a>\n'
                  '    </aside>'
              ),
              'bloc3-github.html': (
                  '    <aside class="pedagogical-highlight" aria-label="Accés ràpid a GitHub" style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:0 0 1rem;">\n'
                  '      <div style="display:flex;align-items:center;gap:.7rem;flex:1 1 18rem;">\n'
                  '        <i data-lucide="github" aria-hidden="true" style="width:24px;height:24px;flex:0 0 auto;"></i>\n'
                  '        <div><strong>Accés ràpid</strong><br><span style="font-size:.875rem;">Obriu GitHub per seguir la configuració i la publicació del recurs.</span></div>\n'
                  '      </div>\n'
                  '      <a class="btn-primary-action" href="https://github.com/" target="_blank" rel="noopener" style="text-decoration:none;">\n'
                  '        <span>Ves a GitHub</span><i data-lucide="external-link" aria-hidden="true"></i>\n'
                  '      </a>\n'
                  '    </aside>'
              ),
          }

          needle = '<main id="contingut-principal" class="main-content"><nav class="usage-paths" aria-label="Orientació d’ús del bloc">'
          for filename, box in pages.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if 'aria-label="Accés ràpid a ' in text:
                  raise SystemExit(f'{filename}: la capsa ja existeix')
              if needle not in text:
                  raise SystemExit(f'{filename}: no s’ha trobat el punt d’inserció')
              replacement = '<main id="contingut-principal" class="main-content">\n' + box + '\n    <nav class="usage-paths" aria-label="Orientació d’ús del bloc">'
              path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Build printable dossier
        run: python scripts/build_print.py
      - name: Validate source changes
        run: python scripts/validate_site.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloc2-antigravity.html bloc3-github.html
          git commit -m "Afegeix accessos ràpids a Antigravity i GitHub"
          git push
