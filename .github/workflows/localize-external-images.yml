name: Localize external images

on:
  push:
    paths:
      - .github/workflows/localize-external-images.yml

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download visual assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/logos
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" -o assets/images/logos/github-mark.png
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://git-scm.com/images/logos/downloads/Git-Icon-1788C.svg" -o assets/images/logos/git.svg
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://upload.wikimedia.org/wikipedia/commons/b/b5/Google-gemini-icon.png" -o assets/images/logos/gemini.png
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://upload.wikimedia.org/wikipedia/commons/5/5c/Google_Sites_Logo_05.2026.svg" -o assets/images/logos/google-sites.svg
          test -s assets/images/logos/github-mark.png
          test -s assets/images/logos/git.svg
          test -s assets/images/logos/gemini.png
          test -s assets/images/logos/google-sites.svg

      - name: Use local copies
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png|assets/images/logos/github-mark.png|g' bloc1-marc.html
          sed -i 's|https://git-scm.com/images/logos/downloads/Git-Icon-1788C.svg|assets/images/logos/git.svg|g' bloc1-marc.html
          sed -i 's|https://upload.wikimedia.org/wikipedia/commons/b/b5/Google-gemini-icon.png|assets/images/logos/gemini.png|g' bloc4-pages-sites.html
          sed -i 's|https://upload.wikimedia.org/wikipedia/commons/5/5c/Google_Sites_Logo_05.2026.svg|assets/images/logos/google-sites.svg|g' bloc4-pages-sites.html
          if grep -RniE '<img[^>]+src="https?://' --include='*.html' .; then
            echo 'External img source remains.'
            exit 1
          fi

      - name: Commit localized assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/localize-external-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: store remaining visual assets locally"
          git push
