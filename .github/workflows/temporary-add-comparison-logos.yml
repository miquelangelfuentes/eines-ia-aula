name: Temporary add comparison service logos

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-add-comparison-logos.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add service logos to comparison table
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bloc2-antigravity.html')
          text = path.read_text(encoding='utf-8')

          if 'data-service-logo="antigravity"' not in text:
              replacements = {
                  '<small style="color:var(--text-muted);">(Google)</small>\n              </td>': '''<small style="color:var(--text-muted);">(Google)</small>\n                <div data-service-logo="antigravity" style="width:72px;height:72px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--border-color);border-radius:var(--radius-md);margin-top:.7rem;">\n                  <img src="https://antigravity.google/assets/image/brand/antigravity-icon__full-color.png" width="56" height="56" alt="Logotip de Google Antigravity" loading="lazy" style="display:block;width:56px;height:56px;object-fit:contain;">\n                </div>\n              </td>''',
                  '<small style="color:var(--text-muted);">(OpenAI)</small>\n              </td>': '''<small style="color:var(--text-muted);">(OpenAI)</small>\n                <div data-service-logo="codex" style="width:72px;height:72px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--border-color);border-radius:var(--radius-md);margin-top:.7rem;">\n                  <img src="https://cdn.simpleicons.org/openai/000000" width="56" height="56" alt="Logotip de ChatGPT Codex" loading="lazy" style="display:block;width:56px;height:56px;object-fit:contain;padding:4px;">\n                </div>\n              </td>''',
                  '<small style="color:var(--text-muted);">(Anthropic)</small>\n              </td>': '''<small style="color:var(--text-muted);">(Anthropic)</small>\n                <div data-service-logo="claude-code" style="width:72px;height:72px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--border-color);border-radius:var(--radius-md);margin-top:.7rem;">\n                  <img src="https://cdn.simpleicons.org/claude/D97757" width="56" height="56" alt="Logotip de Claude Code" loading="lazy" style="display:block;width:56px;height:56px;object-fit:contain;padding:4px;">\n                </div>\n              </td>'''
              }

              for old, new in replacements.items():
                  if old not in text:
                      raise SystemExit(f'Expected comparison cell not found: {old[:60]}')
                  text = text.replace(old, new, 1)

              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change and remove temporary workflow
        run: |
          rm .github/workflows/temporary-add-comparison-logos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloc2-antigravity.html .github/workflows/temporary-add-comparison-logos.yml
          git commit -m "feat: add service logos to agent comparison"
          git push
