name: Audit decorative magic icons

on:
  push:
    paths:
      - '.github/workflows/audit-magic-icons.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find magic-themed icons
        run: |
          echo '=== Lucide icon references ==='
          grep -RniE 'data-lucide="[^"]*(spark|wand|magic|star)[^"]*"' --include='*.html' --include='*.js' . || true
          echo '=== Emoji / text references ==='
          grep -RniE '✨|🪄|sparkles|wand-sparkles|magic-wand' --include='*.html' --include='*.js' . || true
