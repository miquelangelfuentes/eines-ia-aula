# Apply workshop workflow update
name: Apply Antigravity GitHub workflow

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-antigravity-github-workflow.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply content changes
        run: python scripts/update_workflow_antigravity_github.py
      - name: Build printable dossier
        run: python scripts/build_print.py
      - name: Validate site
        run: python scripts/validate_site.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloc2-antigravity.html bloc3-github.html README.md
          git commit -m "Alinea la pràctica amb el flux Antigravity GitHub"
          git push
