name: Apply auth polish

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply polish
        run: python scripts/polish_auth_novell.py
      - name: Build printable dossier
        run: python scripts/build_print.py
      - name: Validate site
        run: python scripts/validate_site.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bloc3-github.html
          git diff --cached --quiet && exit 0
          git commit -m "Polir la guia d'autenticació per a docents novells"
          git push
