name: Add GitHub Pages guide box

on:
  push:
    paths:
      - '.github/workflows/add-pages-guide-box.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Insert official GitHub Pages guide box
        shell: python
        run: |
          from pathlib import Path
          path = Path('bloc3-github.html')
          text = path.read_text(encoding='utf-8')
          target = '''      <h3 style="margin-top: 2rem; margin-bottom: 0.75rem;">Com activar GitHub Pages en 3 clics:</h3>\n\n      <div class="ordered-steps">'''
          replacement = '''      <h3 style="margin-top: 2rem; margin-bottom: 0.75rem;">Com activar GitHub Pages en 3 clics:</h3>\n\n      <div style="margin-top: 1rem; margin-bottom: 2rem; padding: 0.85rem 1.15rem; background: var(--bg-subtle); border-radius: var(--radius-md); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem;">\n        <span style="font-size: 0.875rem; color: var(--text-main); display: inline-flex; align-items: center; gap: 0.45rem;">\n          <i data-lucide="book-open-check" style="width: 20px; height: 20px; flex: 0 0 auto; color: var(--accent-primary);"></i>\n          <span><strong>Necessiteu veure els passos amb més detall?</strong> Guia oficial de GitHub per configurar l'origen de publicació del vostre lloc amb GitHub Pages.</span>\n        </span>\n        <a href="https://docs.github.com/es/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site" target="_blank" rel="noopener" style="font-size: 0.825rem; font-weight: 600; color: var(--accent-primary); text-decoration: none; display: inline-flex; align-items: center; gap: 0.3rem;">\n          <span>Obrir la guia oficial de GitHub</span> ↗\n        </a>\n      </div>\n\n      <div class="ordered-steps">'''
          if target not in text:
              raise SystemExit('Target heading not found or structure changed')
          path.write_text(text.replace(target, replacement, 1), encoding='utf-8')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bloc3-github.html
          git commit -m 'docs: add official GitHub Pages publishing guide'
          git push
