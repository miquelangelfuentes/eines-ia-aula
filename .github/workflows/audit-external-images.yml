name: Audit external images

on:
  push:
    paths:
      - '.github/workflows/audit-external-images.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find externally loaded visual resources
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [*Path('.').glob('*.html'), *Path('.').glob('*.css'), *Path('.').glob('*.js')]
          patterns = [
              re.compile(r'<img\b[^>]*\bsrc=["\'](https?://[^"\']+)', re.I),
              re.compile(r'<source\b[^>]*\bsrcset=["\'](https?://[^"\']+)', re.I),
              re.compile(r'\bposter=["\'](https?://[^"\']+)', re.I),
              re.compile(r'url\(\s*["\']?(https?://[^)"\']+)', re.I),
          ]
          meta = re.compile(r'<meta\b[^>]*(?:property|name)=["\'](?:og:image|twitter:image)["\'][^>]*content=["\'](https?://[^"\']+)', re.I)
          image_ext = re.compile(r'https?://[^\s"\')>]+\.(?:png|jpe?g|gif|webp|svg|avif)(?:\?[^\s"\')>]*)?', re.I)

          external = []
          metadata = []
          other_image_urls = []
          for path in files:
              text = path.read_text(encoding='utf-8', errors='ignore')
              for n,line in enumerate(text.splitlines(),1):
                  for pat in patterns:
                      for m in pat.finditer(line):
                          external.append((str(path), n, m.group(1)))
                  for m in meta.finditer(line):
                      metadata.append((str(path), n, m.group(1)))
                  for m in image_ext.finditer(line):
                      url=m.group(0)
                      if not any(url==x[2] for x in external) and not any(url==x[2] for x in metadata):
                          other_image_urls.append((str(path), n, url))

          print('=== EXTERNALLY LOADED IMAGES / VISUALS ===')
          if external:
              for x in external: print(f'{x[0]}:{x[1]} {x[2]}')
          else: print('NONE')
          print('\n=== SOCIAL IMAGE METADATA ===')
          if metadata:
              for x in metadata: print(f'{x[0]}:{x[1]} {x[2]}')
          else: print('NONE')
          print('\n=== OTHER ABSOLUTE IMAGE URLS IN CODE/TEXT ===')
          if other_image_urls:
              for x in other_image_urls: print(f'{x[0]}:{x[1]} {x[2]}')
          else: print('NONE')
          PY
